<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Gemini 2.0 — Flash to Frontier (30s Kinetic Stage)</title>
  <style>
    @font-face {
      font-family: 'AntonLocal';
      src: url('../public/fonts/Anton-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'InterLocal';
      src: url('../public/fonts/InterVariable.woff2') format('woff2');
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040711;
      font-family: 'InterLocal', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #stage-container {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: center center;
      box-shadow: 0 40px 140px rgba(0, 0, 0, 0.95), 0 0 80px rgba(78, 130, 238, 0.15);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    canvas#motion-stage {
      display: block;
      width: 1920px;
      height: 1080px;
      background: #040711;
    }

    /* Floating Scrub Bar */
    #playback-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(78, 130, 238, 0.35);
      border-radius: 9999px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 1000;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(78, 130, 238, 0.2);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    button.ctrl-btn {
      background: linear-gradient(135deg, #4E82EE 0%, #7952DE 50%, #C34085 100%);
      color: #FFFFFF;
      border: none;
      padding: 7px 18px;
      border-radius: 9999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.5px;
      transition: transform 0.1s, opacity 0.15s;
    }
    button.ctrl-btn:hover { opacity: 0.92; }
    button.ctrl-btn:active { transform: scale(0.96); }

    .jump-btn {
      background: rgba(255, 255, 255, 0.06);
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .jump-btn:hover { background: rgba(78, 130, 238, 0.22); border-color: #4E82EE; color: #FFFFFF; }

    input[type=range] {
      width: 260px;
      accent-color: #4E82EE;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <canvas id="motion-stage" width="1920" height="1080"></canvas>
  </div>

  <div id="playback-bar">
    <button class="ctrl-btn" id="btn-play-toggle">PLAY / PAUSE</button>
    <input type="range" id="time-slider" min="0" max="30.0" step="0.0333" value="0">
    <span id="time-label" style="font-weight: 700; min-width: 90px; color: #79A7FF;">00:00.00</span>
    <div style="display: flex; gap: 6px;">
      <button class="jump-btn" data-time="0.0">1. HOOK</button>
      <button class="jump-btn" data-time="5.0">2. STAR</button>
      <button class="jump-btn" data-time="10.0">3. WAVEFORM</button>
      <button class="jump-btn" data-time="15.0">4. TOKENS</button>
      <button class="jump-btn" data-time="20.0">5. LATENCY</button>
      <button class="jump-btn" data-time="25.0">6. LOCKUP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('motion-stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const container = document.getElementById('stage-container');
    const slider = document.getElementById('time-slider');
    const timeLabel = document.getElementById('time-label');
    const btnPlay = document.getElementById('btn-play-toggle');

    const W = 1920;
    const H = 1080;
    const TOTAL_DURATION = 30.0;

    // Viewport Auto-Fit Scaling
    function resizeStage() {
      const availW = window.innerWidth - 60;
      const availH = window.innerHeight - 120;
      const scale = Math.min(availW / W, availH / H, 1.0);
      container.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeStage);
    resizeStage();

    // ========================================================
    // MATHEMATICAL EASINGS & KINETICS
    // ========================================================
    const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    function springPunch(t, start, dur = 0.22, s = 1.35) {
      if (t <= start) return 0;
      const p = Math.min(1, (t - start) / dur);
      const p1 = p - 1;
      return p1 * p1 * ((s + 1) * p1 + s) + 1;
    }

    function easeOutExpo(x) {
      return x === 1 ? 1 : 1 - Math.pow(2, -10 * clamp(x));
    }

    function easeInOutQuad(x) {
      return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    }

    // ========================================================
    // PRE-CALCULATED DETERMINISTIC PARTICLE FIELD (120 PARTICLES)
    // ========================================================
    const PARTICLES = [];
    for (let i = 0; i < 140; i++) {
      const seed1 = (Math.sin(i * 19.38) * 10000) % 1;
      const seed2 = (Math.sin(i * 47.92) * 10000) % 1;
      const seed3 = (Math.sin(i * 83.17) * 10000) % 1;
      PARTICLES.push({
        x: (Math.abs(seed1) * 0.92 + 0.04) * W,
        y: (Math.abs(seed2) * 0.88 + 0.06) * H,
        radius: 1.2 + Math.abs(seed3) * 2.8,
        speedX: (Math.abs(seed2) - 0.5) * 18,
        speedY: (Math.abs(seed1) - 0.5) * 22,
        phase: Math.abs(seed3) * Math.PI * 2,
        hueType: i % 3 // 0: Blue, 1: Violet, 2: Magenta
      });
    }

    // ========================================================
    // GEMINI 4-POINT STAR DRAWING UTILITY
    // ========================================================
    function drawGeminiStar(ctx, cx, cy, outerRadius, innerRadius = outerRadius * 0.22, rot = 0) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.beginPath();

      const points = 4;
      const step = Math.PI / points;

      for (let i = 0; i < 2 * points; i++) {
        const r = (i % 2 === 0) ? outerRadius : innerRadius;
        const angle = i * step - Math.PI / 2;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else {
          // Subtle curvature for signature organic Gemini star look
          const prevAngle = (i - 1) * step - Math.PI / 2;
          const prevR = ((i - 1) % 2 === 0) ? outerRadius : innerRadius;
          const prevX = Math.cos(prevAngle) * prevR;
          const prevY = Math.sin(prevAngle) * prevR;
          const midR = (r + prevR) * 0.42;
          const midAngle = (angle + prevAngle) / 2;
          const cpx = Math.cos(midAngle) * midR;
          const cpy = Math.sin(midAngle) * midR;
          ctx.quadraticCurveTo(cpx, cpy, px, py);
        }
      }
      ctx.closePath();
      ctx.restore();
    }

    // ========================================================
    // ZERO-OVERLAP WORD-BY-WORD KINETIC ENGINE
    // ========================================================
    function renderWordLine(ctx, cfg) {
      const {
        words,
        startTimes,
        t,
        x,
        y,
        fontSize = 130,
        fontFamily = "'InterLocal', 'Inter', sans-serif",
        fontWeight = 900,
        align = 'center',
        color = '#FFFFFF',
        gradientFill = false,
        letterSpacing = -1.5,
        wordSpacing = 32
      } = cfg;

      ctx.save();
      ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
      ctx.textBaseline = 'middle';

      // Measure all words first
      const measured = words.map(w => ctx.measureText(w).width);
      const totalWidth = measured.reduce((sum, w) => sum + w, 0) + (words.length - 1) * wordSpacing;

      let startX = x;
      if (align === 'center') startX = x - totalWidth / 2;
      else if (align === 'right') startX = x - totalWidth;

      let currX = startX;

      words.forEach((word, idx) => {
        const st = startTimes[idx];
        const wWidth = measured[idx];

        if (t >= st) {
          const pop = springPunch(t, st, 0.22, 1.4);
          const alpha = clamp((t - st) / 0.12);
          const scale = clamp(pop, 0, 1.4);
          const yOffset = (1 - clamp(pop, 0, 1)) * 36;

          ctx.save();
          const wordCenterX = currX + wWidth / 2;
          const wordCenterY = y + yOffset;

          ctx.translate(wordCenterX, wordCenterY);
          ctx.scale(scale, scale);
          ctx.globalAlpha = alpha;

          if (gradientFill) {
            const grad = ctx.createLinearGradient(-wWidth / 2, 0, wWidth / 2, 0);
            grad.addColorStop(0, '#4E82EE');
            grad.addColorStop(0.5, '#7952DE');
            grad.addColorStop(1, '#C34085');
            ctx.fillStyle = grad;
          } else {
            ctx.fillStyle = color;
          }

          // Subtle glow on word pop
          if (t - st < 0.35) {
            const glowIntensity = (1 - (t - st) / 0.35);
            ctx.shadowColor = '#4E82EE';
            ctx.shadowBlur = 24 * glowIntensity;
          }

          ctx.fillText(word, -wWidth / 2, 0);
          ctx.restore();
        }

        currX += wWidth + wordSpacing;
      });

      ctx.restore();
      return totalWidth;
    }

    // ========================================================
    // AMBIENT BACKGROUND & TOP BAR
    // ========================================================
    function drawBackground(t) {
      // 1. Deep Space Navy / Platinum Obsidian Canvas
      const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W * 0.85);
      bgGrad.addColorStop(0, '#0A1124');
      bgGrad.addColorStop(0.55, '#050914');
      bgGrad.addColorStop(1, '#020409');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // 2. Subtle Iridescent Vignette Halo
      const haloPulse = 0.5 + 0.15 * Math.sin(t * 1.5);
      const haloGrad = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 700);
      haloGrad.addColorStop(0, `rgba(78, 130, 238, ${0.12 * haloPulse})`);
      haloGrad.addColorStop(0.4, `rgba(121, 82, 222, ${0.08 * haloPulse})`);
      haloGrad.addColorStop(0.8, `rgba(195, 64, 133, ${0.04 * haloPulse})`);
      haloGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = haloGrad;
      ctx.fillRect(0, 0, W, H);

      // 3. Subtle Hexagonal Tech Grid Hairlines
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.lineWidth = 1;
      const gridSize = 120;
      for (let gx = 0; gx <= W; gx += gridSize) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, H);
        ctx.stroke();
      }
      for (let gy = 0; gy <= H; gy += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(W, gy);
        ctx.stroke();
      }
      ctx.restore();

      // 4. Vibrant Floating Particles
      ctx.save();
      PARTICLES.forEach((p, idx) => {
        const px = (p.x + p.speedX * t) % W;
        const py = (p.y + p.speedY * t) % H;
        const pulse = 0.4 + 0.6 * Math.sin(t * 2.5 + p.phase);

        let color = 'rgba(78, 130, 238, ';
        if (p.hueType === 1) color = 'rgba(121, 82, 222, ';
        else if (p.hueType === 2) color = 'rgba(195, 64, 133, ';

        ctx.fillStyle = `${color}${0.55 * pulse})`;
        ctx.shadowColor = `${color}0.8)`;
        ctx.shadowBlur = 8 * pulse;

        ctx.beginPath();
        ctx.arc(px < 0 ? px + W : px, py < 0 ? py + H : py, p.radius * (0.8 + 0.3 * pulse), 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();

      // 5. Clean Top Bar: "GOOGLE // GEMINI 2.0" (No debug frame counters)
      ctx.save();
      const topAlpha = clamp(t / 0.8);
      ctx.globalAlpha = topAlpha;

      // Brand Title
      ctx.font = "800 15px 'JetBrains Mono', monospace";
      ctx.fillStyle = '#79A7FF';
      ctx.fillText('GOOGLE', 90, 72);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.fillText('//', 165, 72);

      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('GEMINI 2.0', 195, 72);

      // Status Pill
      ctx.beginPath();
      ctx.roundRect(W - 380, 52, 290, 36, 18);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(78, 130, 238, 0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Glowing dot
      ctx.beginPath();
      ctx.arc(W - 358, 70, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#4E82EE';
      ctx.shadowColor = '#4E82EE';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.font = "700 12px 'JetBrains Mono', monospace";
      ctx.fillStyle = '#E2E8F0';
      ctx.fillText('FRONTIER INTELLIGENCE', W - 342, 74);
      ctx.restore();
    }

    // ========================================================
    // ACT 1 (0.0s - 5.0s): "GEMINI 2.0." -> "FLASH TO FRONTIER."
    // ========================================================
    function drawAct1(t) {
      if (t < 0 || t >= 5.0) return;

      const actProgress = t / 5.0;
      const fadeOut = t > 4.3 ? 1 - (t - 4.3) / 0.7 : 1;

      ctx.save();
      ctx.globalAlpha = clamp(fadeOut);

      // Center decorative iridescent micro-badge
      if (t >= 0.15) {
        const badgePop = springPunch(t, 0.15, 0.25);
        ctx.save();
        ctx.translate(W / 2, 330);
        ctx.scale(badgePop, badgePop);

        ctx.beginPath();
        ctx.roundRect(-140, -18, 280, 36, 18);
        ctx.fillStyle = 'rgba(78, 130, 238, 0.12)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(78, 130, 238, 0.4)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = "800 12px 'JetBrains Mono', monospace";
        ctx.fillStyle = '#79A7FF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('NEXT-GENERATION AI', 0, 1);
        ctx.restore();
      }

      // Line 1: "GEMINI 2.0."
      // Stacked with generous spacing: Y = 460
      renderWordLine(ctx, {
        words: ['GEMINI', '2.0.'],
        startTimes: [0.35, 0.95],
        t,
        x: W / 2,
        y: 460,
        fontSize: 148,
        fontWeight: 900,
        align: 'center',
        color: '#FFFFFF',
        gradientFill: false,
        wordSpacing: 44
      });

      // Line 2: "FLASH TO FRONTIER."
      // Stacked with generous spacing: Y = 620 (160px vertical clearance)
      renderWordLine(ctx, {
        words: ['FLASH', 'TO', 'FRONTIER.'],
        startTimes: [1.90, 2.55, 3.30],
        t,
        x: W / 2,
        y: 620,
        fontSize: 96,
        fontWeight: 800,
        align: 'center',
        gradientFill: true,
        wordSpacing: 34
      });

      // Subtle accent underline under FRONTIER
      if (t >= 3.4) {
        const lineProg = clamp((t - 3.4) / 0.35);
        const lineW = 380 * easeOutExpo(lineProg);
        const lineGrad = ctx.createLinearGradient(W / 2 - lineW / 2, 0, W / 2 + lineW / 2, 0);
        lineGrad.addColorStop(0, '#4E82EE');
        lineGrad.addColorStop(0.5, '#7952DE');
        lineGrad.addColorStop(1, '#C34085');

        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(W / 2 - lineW / 2, 690);
        ctx.lineTo(W / 2 + lineW / 2, 690);
        ctx.stroke();
      }

      ctx.restore();
    }

    // ========================================================
    // ACT 2 (5.0s - 10.0s): 4-POINT GEMINI STAR & PARTICLE TRAILS
    // ========================================================
    function drawAct2(t) {
      if (t < 4.8 || t >= 10.0) return;

      const actTime = t - 5.0;
      const fadeIn = t < 5.5 ? (t - 4.8) / 0.7 : 1;
      const fadeOut = t > 9.3 ? 1 - (t - 9.3) / 0.7 : 1;
      const alpha = clamp(Math.min(fadeIn, fadeOut));

      ctx.save();
      ctx.globalAlpha = alpha;

      const cx = W / 2;
      const cy = H / 2 - 10;

      // Header Tagline
      ctx.save();
      ctx.font = "800 14px 'JetBrains Mono', monospace";
      ctx.fillStyle = '#79A7FF';
      ctx.textAlign = 'center';
      ctx.fillText('NATIVE IRIDESCENT ARCHITECTURE', cx, 230);
      ctx.restore();

      // Main Title: "THE GEMINI CORE"
      renderWordLine(ctx, {
        words: ['THE', 'GEMINI', 'CORE.'],
        startTimes: [5.2, 5.5, 5.8],
        t,
        x: cx,
        y: 285,
        fontSize: 54,
        fontWeight: 900,
        align: 'center',
        color: '#FFFFFF',
        wordSpacing: 22
      });

      // Central Star Bloom Kinetics
      const starScale = springPunch(t, 5.15, 0.45, 1.25);
      const starPulse = 1.0 + 0.06 * Math.sin(actTime * 3.0);
      const starRot = actTime * 0.22;

      // 1. Concentric Iridescent Bloom Glows
      const glowGrad = ctx.createRadialGradient(cx, cy, 30, cx, cy, 340);
      glowGrad.addColorStop(0, 'rgba(121, 82, 222, 0.35)');
      glowGrad.addColorStop(0.4, 'rgba(78, 130, 238, 0.2)');
      glowGrad.addColorStop(0.75, 'rgba(195, 64, 133, 0.08)');
      glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 340, 0, Math.PI * 2);
      ctx.fill();

      // 2. Dynamic Orbiting Particle Trails
      const numOrbits = 3;
      for (let o = 0; o < numOrbits; o++) {
        const orbitRadiusX = 280 + o * 60;
        const orbitRadiusY = 130 + o * 30;
        const orbitAngle = actTime * (1.2 - o * 0.25) + o * (Math.PI / 1.5);
        const orbitTilt = (o - 1) * 0.35;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(orbitTilt);

        // Orbit path hairline
        ctx.beginPath();
        ctx.ellipse(0, 0, orbitRadiusX, orbitRadiusY, 0, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(78, 130, 238, ${0.12 - o * 0.03})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Orbiting glowing node
        const nodeX = Math.cos(orbitAngle) * orbitRadiusX;
        const nodeY = Math.sin(orbitAngle) * orbitRadiusY;
        const nodeGrad = ctx.createRadialGradient(nodeX, nodeY, 0, nodeX, nodeY, 20);
        nodeGrad.addColorStop(0, '#FFFFFF');
        nodeGrad.addColorStop(0.4, o % 2 === 0 ? '#4E82EE' : '#C34085');
        nodeGrad.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.fillStyle = nodeGrad;
        ctx.beginPath();
        ctx.arc(nodeX, nodeY, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 3. Iconic 4-Point Gemini Star (Layered)
      ctx.save();
      const currentRadius = 175 * starScale * starPulse;

      // Outer Star Stroke with Iridescent Gradient
      const starGrad = ctx.createLinearGradient(cx - currentRadius, cy - currentRadius, cx + currentRadius, cy + currentRadius);
      starGrad.addColorStop(0, '#4E82EE');
      starGrad.addColorStop(0.5, '#7952DE');
      starGrad.addColorStop(1, '#C34085');

      ctx.fillStyle = starGrad;
      ctx.shadowColor = '#7952DE';
      ctx.shadowBlur = 45;
      drawGeminiStar(ctx, cx, cy, currentRadius, currentRadius * 0.24, starRot);
      ctx.fill();

      // Inner Core Brilliant Star (White/Cyan Highlight)
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = '#FFFFFF';
      ctx.shadowBlur = 25;
      drawGeminiStar(ctx, cx, cy, currentRadius * 0.55, currentRadius * 0.14, starRot);
      ctx.fill();

      ctx.restore();

      // Feature Badges Surrounding Star
      const badges = [
        { label: 'NATIVE MULTIMODAL', time: 6.2, x: cx - 440, y: cy - 40 },
        { label: 'FLASH 2.0 SPEED', time: 7.0, x: cx + 440, y: cy - 40 },
        { label: 'DEEP REASONING', time: 7.8, x: cx - 440, y: cy + 120 },
        { label: 'MASSIVE CONTEXT', time: 8.4, x: cx + 440, y: cy + 120 }
      ];

      badges.forEach(b => {
        if (t >= b.time) {
          const bPop = springPunch(t, b.time, 0.22);
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.scale(bPop, bPop);

          ctx.beginPath();
          ctx.roundRect(-135, -24, 270, 48, 24);
          ctx.fillStyle = 'rgba(11, 15, 25, 0.85)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(121, 82, 222, 0.45)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.font = "800 13px 'JetBrains Mono', monospace";
          ctx.fillStyle = '#FFFFFF';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.label, 0, 1);
          ctx.restore();
        }
      });

      ctx.restore();
    }

    // ========================================================
    // ACT 3 (10.0s - 15.0s): MULTIMODAL AUDIO & VISION WAVEFORM
    // ========================================================
    function drawAct3(t) {
      if (t < 9.8 || t >= 15.0) return;

      const actTime = t - 10.0;
      const fadeIn = t < 10.5 ? (t - 9.8) / 0.7 : 1;
      const fadeOut = t > 14.3 ? 1 - (t - 14.3) / 0.7 : 1;
      const alpha = clamp(Math.min(fadeIn, fadeOut));

      ctx.save();
      ctx.globalAlpha = alpha;

      const cx = W / 2;

      // Section Header
      ctx.save();
      ctx.font = "800 14px 'JetBrains Mono', monospace";
      ctx.fillStyle = '#79A7FF';
      ctx.textAlign = 'center';
      ctx.fillText('REAL-TIME MULTIMODAL INGESTION', cx, 230);
      ctx.restore();

      // Main Act Title: "AUDIO // VISION // CODE"
      renderWordLine(ctx, {
        words: ['AUDIO.', 'VISION.', 'CODE.'],
        startTimes: [10.2, 10.6, 11.0],
        t,
        x: cx,
        y: 285,
        fontSize: 54,
        fontWeight: 900,
        align: 'center',
        gradientFill: true,
        wordSpacing: 30
      });

      // HUD Container Box (Obsidian Glass)
      const hudW = 1100;
      const hudH = 340;
      const hudY = 410;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(cx - hudW / 2, hudY, hudW, hudH, 20);
      ctx.fillStyle = 'rgba(11, 15, 25, 0.75)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(78, 130, 238, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Top status line in HUD
      ctx.font = "700 12px 'JetBrains Mono', monospace";
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fillText('INPUT STREAM: 32-BAND EQUALIZER & LIVE NEURAL ENCODER', cx - hudW / 2 + 36, hudY + 40);

      ctx.fillStyle = '#4E82EE';
      ctx.textAlign = 'right';
      ctx.fillText('SAMPLING @ 48kHz / 30FPS', cx + hudW / 2 - 36, hudY + 40);

      // 32-Bar Dynamic Frequency Visualizer
      const numBars = 32;
      const barSpacing = 8;
      const barW = (hudW - 120 - (numBars - 1) * barSpacing) / numBars;
      const barBaseY = hudY + hudH - 55;
      const maxBarH = 190;

      for (let i = 0; i < numBars; i++) {
        // Deterministic spectrum synthesis tied to breakbeat & harmonic peaks
        const freqIndex = i / numBars;
        const wave1 = Math.sin(actTime * 7.5 + freqIndex * Math.PI * 4);
        const wave2 = Math.cos(actTime * 11.2 - freqIndex * Math.PI * 3);
        const kickBounce = Math.exp(-((actTime * 2.4) % 1.0) * 4.5);
        const chimeBounce = Math.sin(actTime * 14.0 + i) * 0.25;

        let heightFactor = (0.25 + 0.35 * Math.abs(wave1) + 0.25 * Math.abs(wave2) + 0.35 * kickBounce + chimeBounce);
        // Emphasize mid-frequencies (voice & audio range)
        heightFactor *= (1 - Math.abs(freqIndex - 0.4) * 0.7);
        heightFactor = clamp(heightFactor, 0.08, 1.0);

        const currentBarH = maxBarH * heightFactor;
        const barX = (cx - hudW / 2 + 60) + i * (barW + barSpacing);
        const barY = barBaseY - currentBarH;

        // Gradient Bar fill
        const barGrad = ctx.createLinearGradient(barX, barBaseY, barX, barY);
        barGrad.addColorStop(0, '#4E82EE');
        barGrad.addColorStop(0.55, '#7952DE');
        barGrad.addColorStop(1, '#C34085');

        ctx.fillStyle = barGrad;
        ctx.beginPath();
        ctx.roundRect(barX, barY, barW, currentBarH, 4);
        ctx.fill();

        // Glowing Peak Cap
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = '#C34085';
        ctx.shadowBlur = 8;
        ctx.fillRect(barX, barY - 3, barW, 3);
        ctx.shadowBlur = 0;
      }

      ctx.restore();

      // Sensory Stream Sub-Labels
      const streamBadges = [
        { label: 'SPEECH & ACOUSTICS', x: cx - 360, y: 810 },
        { label: 'SPATIAL VISION', x: cx, y: 810 },
        { label: 'FUNCTION CALLING', x: cx + 360, y: 810 }
      ];

      streamBadges.forEach(sb => {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(sb.x - 140, sb.y - 18, 280, 36, 18);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.font = "800 12px 'JetBrains Mono', monospace";
        ctx.fillStyle = '#E2E8F0';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(sb.label, sb.x, sb.y);
        ctx.restore();
      });

      ctx.restore();
    }

    // ========================================================
    // ACT 4 (15.0s - 20.0s): "2 MILLION TOKENS." -> "DEEP RESEARCH."
    // ========================================================
    function drawAct4(t) {
      if (t < 14.8 || t >= 20.0) return;

      const actTime = t - 15.0;
      const fadeIn = t < 15.5 ? (t - 14.8) / 0.7 : 1;
      const fadeOut = t > 19.3 ? 1 - (t - 19.3) / 0.7 : 1;
      const alpha = clamp(Math.min(fadeIn, fadeOut));

      ctx.save();
      ctx.globalAlpha = alpha;

      const cx = W / 2;

      // Section Tagline
      ctx.save();
      ctx.font = "800 14px 'JetBrains Mono', monospace";
      ctx.fillStyle = '#79A7FF';
      ctx.textAlign = 'center';
      ctx.fillText('UNMATCHED CONTEXT WINDOW & AUTONOMOUS DISCOVERY', cx, 230);
      ctx.restore();

      // Line 1: "2 MILLION TOKENS." (Y = 370)
      renderWordLine(ctx, {
        words: ['2', 'MILLION', 'TOKENS.'],
        startTimes: [15.3, 15.9, 16.5],
        t,
        x: cx,
        y: 370,
        fontSize: 120,
        fontWeight: 900,
        align: 'center',
        color: '#FFFFFF',
        wordSpacing: 36
      });

      // Context Stream Bar Visual (Between Lines)
      if (t >= 16.6) {
        const streamProg = clamp((t - 16.6) / 0.75);
        const barW = 1000;
        const currentFillW = barW * easeOutExpo(streamProg);
        const barY = 470;

        ctx.save();
        // Background track
        ctx.beginPath();
        ctx.roundRect(cx - barW / 2, barY, barW, 20, 10);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.fill();

        // Iridescent Progress Fill
        if (currentFillW > 0) {
          const fillGrad = ctx.createLinearGradient(cx - barW / 2, 0, cx - barW / 2 + currentFillW, 0);
          fillGrad.addColorStop(0, '#4E82EE');
          fillGrad.addColorStop(0.5, '#7952DE');
          fillGrad.addColorStop(1, '#C34085');

          ctx.beginPath();
          ctx.roundRect(cx - barW / 2, barY, currentFillW, 20, 10);
          ctx.fillStyle = fillGrad;
          ctx.shadowColor = '#4E82EE';
          ctx.shadowBlur = 18;
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        // Sub-milestone markers
        const markers = [
          { label: '128K', pos: 0.12 },
          { label: '500K', pos: 0.35 },
          { label: '1.0M', pos: 0.65 },
          { label: '2.0M TOKENS', pos: 1.0 }
        ];

        markers.forEach(m => {
          const mx = (cx - barW / 2) + barW * m.pos;
          ctx.beginPath();
          ctx.arc(mx, barY + 10, 4, 0, Math.PI * 2);
          ctx.fillStyle = streamProg >= m.pos ? '#FFFFFF' : 'rgba(255,255,255,0.25)';
          ctx.fill();

          ctx.font = "700 11px 'JetBrains Mono', monospace";
          ctx.fillStyle = streamProg >= m.pos ? '#E2E8F0' : 'rgba(255,255,255,0.35)';
          ctx.textAlign = 'center';
          ctx.fillText(m.label, mx, barY + 38);
        });

        ctx.restore();
      }

      // Line 2: "DEEP RESEARCH." (Generous vertical spacing: Y = 620)
      renderWordLine(ctx, {
        words: ['DEEP', 'RESEARCH.'],
        startTimes: [17.7, 18.4],
        t,
        x: cx,
        y: 620,
        fontSize: 104,
        fontWeight: 900,
        align: 'center',
        gradientFill: true,
        wordSpacing: 34
      });

      // Autonomous Research Synthesis Badges
      if (t >= 18.6) {
        const stepProgress = springPunch(t, 18.6, 0.28);
        ctx.save();
        ctx.translate(cx, 750);
        ctx.scale(stepProgress, stepProgress);

        const nodes = ['PLAN', 'BROWSE & RETRIEVE', 'SYNTHESIZE', 'VERIFY EVIDENCE'];
        const totalNodeW = 860;
        const nodeSpacing = totalNodeW / (nodes.length - 1);

        nodes.forEach((n, idx) => {
          const nx = -totalNodeW / 2 + idx * nodeSpacing;

          // Connecting line
          if (idx < nodes.length - 1) {
            ctx.strokeStyle = 'rgba(121, 82, 222, 0.4)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(nx + 80, 0);
            ctx.lineTo(nx + nodeSpacing - 80, 0);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.beginPath();
          ctx.roundRect(nx - 75, -18, 150, 36, 18);
          ctx.fillStyle = 'rgba(11, 15, 25, 0.9)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(78, 130, 238, 0.45)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.font = "800 11px 'JetBrains Mono', monospace";
          ctx.fillStyle = '#FFFFFF';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(n, nx, 1);
        });

        ctx.restore();
      }

      ctx.restore();
    }

    // ========================================================
    // ACT 5 (20.0s - 25.0s): "REAL-TIME MULTIMODAL." -> "SUB-100MS LATENCY."
    // ========================================================
    function drawAct5(t) {
      if (t < 19.8 || t >= 25.0) return;

      const actTime = t - 20.0;
      const fadeIn = t < 20.5 ? (t - 19.8) / 0.7 : 1;
      const fadeOut = t > 24.3 ? 1 - (t - 24.3) / 0.7 : 1;
      const alpha = clamp(Math.min(fadeIn, fadeOut));

      ctx.save();
      ctx.globalAlpha = alpha;

      const cx = W / 2;

      // Section Tagline
      ctx.save();
      ctx.font = "800 14px 'JetBrains Mono', monospace";
      ctx.fillStyle = '#79A7FF';
      ctx.textAlign = 'center';
      ctx.fillText('INSTANTANEOUS STREAMING PROTOCOL', cx, 230);
      ctx.restore();

      // Line 1: "REAL-TIME MULTIMODAL." (Y = 370)
      renderWordLine(ctx, {
        words: ['REAL-TIME', 'MULTIMODAL.'],
        startTimes: [20.3, 21.1],
        t,
        x: cx,
        y: 370,
        fontSize: 104,
        fontWeight: 900,
        align: 'center',
        color: '#FFFFFF',
        wordSpacing: 34
      });

      // Line 2: "SUB-100MS LATENCY." (Y = 510)
      renderWordLine(ctx, {
        words: ['SUB-100MS', 'LATENCY.'],
        startTimes: [22.3, 23.1],
        t,
        x: cx,
        y: 510,
        fontSize: 110,
        fontWeight: 900,
        align: 'center',
        gradientFill: true,
        wordSpacing: 34
      });

      // Speed Benchmark Telemetry Visual
      if (t >= 23.2) {
        const gaugeProg = springPunch(t, 23.2, 0.35);
        ctx.save();
        ctx.translate(cx, 710);
        ctx.scale(gaugeProg, gaugeProg);

        // Telemetry Card Box
        const cardW = 820;
        const cardH = 140;
        ctx.beginPath();
        ctx.roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 20);
        ctx.fillStyle = 'rgba(11, 15, 25, 0.85)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(78, 130, 238, 0.35)';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        // Left: Time-to-First-Token
        ctx.textAlign = 'left';
        ctx.font = "800 13px 'JetBrains Mono', monospace";
        ctx.fillStyle = '#79A7FF';
        ctx.fillText('TIME-TO-FIRST-TOKEN (TTFT)', -cardW / 2 + 50, -18);

        ctx.font = "900 44px 'InterLocal', 'Inter', sans-serif";
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('64ms', -cardW / 2 + 50, 32);

        // Divider
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -cardH / 2 + 25);
        ctx.lineTo(0, cardH / 2 - 25);
        ctx.stroke();

        // Right: Throughput comparison
        ctx.font = "800 13px 'JetBrains Mono', monospace";
        ctx.fillStyle = '#C34085';
        ctx.fillText('VELOCITY ACCELERATION', 45, -18);

        ctx.font = "900 44px 'InterLocal', 'Inter', sans-serif";
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('12x FASTER', 45, 32);

        ctx.restore();
      }

      ctx.restore();
    }

    // ========================================================
    // ACT 6 (25.0s - 30.0s): CLIMAX & SOVEREIGN MASTER LOCKUP
    // ========================================================
    function drawAct6(t) {
      if (t < 24.8) return;

      const actTime = t - 25.0;
      const fadeIn = t < 25.6 ? (t - 24.8) / 0.8 : 1;
      const alpha = clamp(fadeIn);

      ctx.save();
      ctx.globalAlpha = alpha;

      const cx = W / 2;
      const cy = H / 2;

      // 26.0s Massive Frontier Impact Climax: Expanding Iridescent Halo
      if (t >= 26.0) {
        const impactTime = t - 26.0;
        const ringProg = Math.min(1.0, impactTime / 1.6);
        const ringRadius = 150 + ringProg * 750;
        const ringAlpha = (1 - ringProg) * 0.65;

        // Expanding shockwave ring 1
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy - 20, ringRadius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(78, 130, 238, ${ringAlpha})`;
        ctx.lineWidth = 4 * (1 - ringProg);
        ctx.shadowColor = '#4E82EE';
        ctx.shadowBlur = 30;
        ctx.stroke();

        // Expanding shockwave ring 2
        if (impactTime > 0.15) {
          const rProg2 = Math.min(1.0, (impactTime - 0.15) / 1.6);
          ctx.beginPath();
          ctx.arc(cx, cy - 20, 120 + rProg2 * 680, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(195, 64, 133, ${(1 - rProg2) * 0.55})`;
          ctx.lineWidth = 3 * (1 - rProg2);
          ctx.shadowColor = '#C34085';
          ctx.shadowBlur = 24;
          ctx.stroke();
        }
        ctx.restore();
      }

      // Master Center Star Icon (Above Typography)
      const starScale = springPunch(t, 25.3, 0.45, 1.3);
      const starPulse = 1.0 + 0.05 * Math.sin(actTime * 2.5);
      const starRadius = 80 * starScale * starPulse;

      ctx.save();
      ctx.translate(cx, cy - 170);

      // Star Halo
      const sHalo = ctx.createRadialGradient(0, 0, 10, 0, 0, 190);
      sHalo.addColorStop(0, 'rgba(78, 130, 238, 0.35)');
      sHalo.addColorStop(0.5, 'rgba(121, 82, 222, 0.2)');
      sHalo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sHalo;
      ctx.beginPath();
      ctx.arc(0, 0, 190, 0, Math.PI * 2);
      ctx.fill();

      // Star shape
      const starGrad = ctx.createLinearGradient(-starRadius, -starRadius, starRadius, starRadius);
      starGrad.addColorStop(0, '#4E82EE');
      starGrad.addColorStop(0.5, '#7952DE');
      starGrad.addColorStop(1, '#C34085');
      ctx.fillStyle = starGrad;
      ctx.shadowColor = '#7952DE';
      ctx.shadowBlur = 32;
      drawGeminiStar(ctx, 0, 0, starRadius, starRadius * 0.24, actTime * 0.15);
      ctx.fill();

      // Brilliant core
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = '#FFFFFF';
      ctx.shadowBlur = 18;
      drawGeminiStar(ctx, 0, 0, starRadius * 0.5, starRadius * 0.13, actTime * 0.15);
      ctx.fill();
      ctx.restore();

      // Top brand word: "GOOGLE"
      if (t >= 25.6) {
        const gPop = springPunch(t, 25.6, 0.25);
        ctx.save();
        ctx.translate(cx, cy - 20);
        ctx.scale(gPop, gPop);
        ctx.font = "800 24px 'JetBrains Mono', monospace";
        ctx.fillStyle = '#9AA0A6';
        ctx.textAlign = 'center';
        ctx.letterSpacing = '6px';
        ctx.fillText('G O O G L E', 0, 0);
        ctx.restore();
      }

      // Sovereign Master Lockup: "GEMINI 2.0."
      // Stacked with generous spacing: Y = cy + 70
      renderWordLine(ctx, {
        words: ['GEMINI', '2.0.'],
        startTimes: [25.9, 26.0],
        t,
        x: cx,
        y: cy + 70,
        fontSize: 136,
        fontWeight: 900,
        align: 'center',
        gradientFill: true,
        wordSpacing: 40
      });

      // Bottom Model Lineup Pill
      if (t >= 26.6) {
        const pillProg = springPunch(t, 26.6, 0.35);
        ctx.save();
        ctx.translate(cx, cy + 185);
        ctx.scale(pillProg, pillProg);

        ctx.beginPath();
        ctx.roundRect(-240, -22, 480, 44, 22);
        ctx.fillStyle = 'rgba(11, 15, 25, 0.85)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(78, 130, 238, 0.4)';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        ctx.font = "800 13px 'JetBrains Mono', monospace";
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('FLASH  //  PRO  //  DEEP RESEARCH', 0, 1);
        ctx.restore();
      }

      // Final Call to Action
      if (t >= 27.2) {
        const ctaProg = clamp((t - 27.2) / 0.4);
        ctx.save();
        ctx.globalAlpha = ctaProg;
        ctx.font = "600 14px 'JetBrains Mono', monospace";
        ctx.fillStyle = '#79A7FF';
        ctx.textAlign = 'center';
        ctx.fillText('ai.google.dev  —  AVAILABLE NOW IN PREVIEW & API', cx, cy + 250);
        ctx.restore();
      }

      ctx.restore();
    }

    // ========================================================
    // MASTER DETERMINISTIC FRAME RENDERER: window.__renderFrameAt(t)
    // ========================================================
    window.__renderFrameAt = function(t) {
      t = clamp(t, 0, TOTAL_DURATION);

      // 1. Draw Ambient Background, Particle Field, and Top Bar
      drawBackground(t);

      // 2. Render Corresponding Kinetic Acts
      drawAct1(t);
      drawAct2(t);
      drawAct3(t);
      drawAct4(t);
      drawAct5(t);
      drawAct6(t);
    };

    // ========================================================
    // INTERACTIVE SCRUBBER & REAL-TIME AUDIO SYNCHRONIZATION
    // ========================================================
    let isPlaying = false;
    let playStartTime = 0;
    let pausedAt = 0;
    let animFrameId = null;

    // Optional audio preview with Web Audio API or audio element
    const audio = new Audio('dist/soundtrack-gemini.wav');

    function updateTimeDisplay(t) {
      slider.value = t;
      const mins = Math.floor(t / 60);
      const secs = Math.floor(t % 60);
      const ms = Math.floor((t % 1) * 100);
      timeLabel.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    function tick() {
      if (!isPlaying) return;
      const elapsed = (performance.now() - playStartTime) / 1000 + pausedAt;
      if (elapsed >= TOTAL_DURATION) {
        pausePlayback();
        updateTimeDisplay(TOTAL_DURATION);
        window.__renderFrameAt(TOTAL_DURATION);
        return;
      }
      updateTimeDisplay(elapsed);
      window.__renderFrameAt(elapsed);
      animFrameId = requestAnimationFrame(tick);
    }

    function startPlayback() {
      isPlaying = true;
      btnPlay.textContent = 'PAUSE';
      playStartTime = performance.now();
      audio.currentTime = pausedAt;
      audio.play().catch(() => {});
      animFrameId = requestAnimationFrame(tick);
    }

    function pausePlayback() {
      isPlaying = false;
      btnPlay.textContent = 'PLAY';
      if (animFrameId) cancelAnimationFrame(animFrameId);
      pausedAt = parseFloat(slider.value);
      audio.pause();
    }

    btnPlay.addEventListener('click', () => {
      if (isPlaying) pausePlayback();
      else startPlayback();
    });

    slider.addEventListener('input', (e) => {
      const t = parseFloat(e.target.value);
      pausedAt = t;
      if (isPlaying) {
        playStartTime = performance.now();
        audio.currentTime = t;
      }
      updateTimeDisplay(t);
      window.__renderFrameAt(t);
    });

    document.querySelectorAll('.jump-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = parseFloat(btn.dataset.time);
        pausedAt = t;
        if (isPlaying) {
          playStartTime = performance.now();
          audio.currentTime = t;
        }
        updateTimeDisplay(t);
        window.__renderFrameAt(t);
      });
    });

    // Initial render at frame 0
    document.fonts.ready.then(() => {
      window.__renderFrameAt(0);
    });
  </script>
</body>
</html>
